<style>
:root{--bg:#fff5f7;--card:#ffffff;--ink:#3b1a24;--muted:#8a5a68;--accent:#e0245e;--accent2:#ff7aa2;--line:#f3cdd8;--ok:#1a9d5c;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f15;--card:#2a1620;--ink:#ffe8ee;--muted:#d3a1b1;--accent:#ff5c8a;--accent2:#c2185b;--line:#4a2634;--ok:#46d58a;--no:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;padding:20px 16px 40px}
h1{text-align:center;font-size:27px;margin:4px 0}
.sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:14px}
.logo{display:block;width:230px;max-width:70%;border-radius:18px;margin:0 auto 10px}
#splash{position:fixed;inset:0;z-index:50;background:#2a0a1f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#splash .pic{position:relative;width:100%;max-width:900px}
#splash img{display:block;width:100%;height:auto}
#splash .hot{position:absolute;left:62%;top:53%;width:33.5%;height:12%;background:transparent;border:0;margin:0;padding:0;border-radius:30px;cursor:pointer;width:33.5%}
#splash .playbtn{width:min(86%,360px);margin:16px auto 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:600;width:100%;margin-top:10px}
button.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button.ok{background:var(--ok)} button.no{background:var(--no)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px}
.code{text-align:center;font-size:30px;letter-spacing:6px;font-weight:700;color:var(--accent);margin:4px 0}
.hint{text-align:center;color:var(--muted);font-size:13px}
.scores{display:flex;gap:10px;margin-bottom:14px}
.sc{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.sc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.sc .n{font-size:13px;color:var(--muted)} .sc .p{font-size:28px;font-weight:700;color:var(--accent)}
.task{text-align:center}
.task .cat{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--accent)}
.task .txt{font-size:20px;line-height:1.4;margin:10px 0;font-weight:600}
.msg{text-align:center;color:var(--accent);min-height:20px;font-size:14px;margin-top:8px}
.res{text-align:center;font-size:15px;margin-bottom:12px}
.hidden{display:none}
</style>
</head>

  <h1 style="display:none">Luma Love</h1>
  <p class="sub">Luma Love · Love, Play, Win. Play together from anywhere.</p>

  <div id="auth" class="card hidden">
    <label for="un">Username</label>
    <input id="un" maxlength="20" placeholder="e.g. charles_love" autocapitalize="none" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="Your password" autocomplete="current-password">
    <button id="login">Log in</button>
    <div class="msg" id="amsg"></div>
  </div>

  <div id="lobby" class="card hidden">
    <p class="hint">Playing as <b id="who"></b></p>
    <input id="name" type="hidden">
    <button id="create">Create a new game</button>
    <label for="join" style="margin-top:16px">Or enter your partner’s game code</label>
    <input id="join" maxlength="5" placeholder="e.g. K7M2Q" style="text-transform:uppercase">
    <button id="joinBtn" class="alt">Join game</button>
    <div class="msg" id="lmsg"></div>
    <button id="logout" class="alt">Log out</button>
  </div>

  <div id="adminBox" class="card hidden">
      <p class="hint"><b>Admin: add a player</b></p>
      <input id="nun" maxlength="20" placeholder="New username" autocapitalize="none">
      <input id="npw" placeholder="Password for them (min 6)" style="margin-top:8px">
      <button id="addP">Add player</button>
      <div class="msg" id="admsg"></div>
      <div id="plist" class="hint" style="text-align:left"></div>
    </div>


  <div id="game" class="hidden">
    <div class="card" id="waiting">
      <p class="hint">Share this game code with your partner</p>
      <div class="code" id="codeShow"></div>
      <p class="hint">Waiting for your partner to join…</p>
    </div>
    <div class="scores" id="scores"></div>
    <div id="res" class="res"></div>

    <div class="card" id="pick">
      <p class="hint" id="pickInfo"></p>
      <div id="pickBox">
        <label for="num">Pick a number from 1 to <span id="max"></span></label>
        <input id="num" type="number" inputmode="numeric" min="1" placeholder="e.g. 214">
        <button id="go">Reveal my task ❤️</button>
        <button id="rnd" class="alt">🎲 Surprise me</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card task hidden" id="taskCard">
      <div class="hint" id="tn"></div>
      <div class="cat" id="tc"></div>
      <div class="txt" id="tt"></div>
      <p class="hint" id="tinfo"></p>
      <button id="did">I did it ✅</button>
      <div id="confirmBox" class="hidden">
        <p style="text-align:center;font-weight:600;margin:6px 0 0" id="askQ">Satisfied?</p>
        <div class="row"><button class="ok" id="yes">Yes, +10</button><button class="no" id="nope">No, 0</button></div>
      </div>
    </div>

    <p class="hint"><span id="used">0</span> of <span id="total"></span> tasks played · Game <b id="codeSmall"></b></p>
    <button class="alt" id="again">Start a fresh game (same room)</button>
    <button class="alt" id="leave">Leave game</button>
  </div>
  <div class="msg" id="gmsg"></div>
</div>

const TOTAL = base.length;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(seed){const a=base.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const $=id=>document.getElementById(id);
$("max").textContent=TOTAL; $("total").textContent=TOTAL; $("num").max=TOTAL;

let db=null, me=null, code=null, ref=null, unsub=null, tasks=null, seedUsed=null, st=null;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
function newCode(){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<5;i++)s+=ch[Math.floor(Math.random()*ch.length)];return s;}
function say(id,t){$(id).textContent=t||"";}

let uname="Player";
const ADMIN_USER="admin";
const ADMIN_EMAIL=ADMIN_USER+"@luma-love.app";
let isAdm=false;
async function init(){
  say("gmsg","");
  if(firebaseConfig.apiKey.startsWith("PASTE")){
    $("gmsg").textContent="Setup needed: paste your Firebase config.";
    return;
  }
  if(typeof firebase==="undefined"||!firebase.firestore||!firebase.auth){
    $("gmsg").textContent="Could not load the Firebase files. Check your internet, turn off any ad-blocker or data saver, and reload.";
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
  }catch(e){$("gmsg").textContent="Could not connect to Firebase: "+((e&&(e.code||e.message))||"unknown error");return;}
  firebase.auth().onAuthStateChanged(async user=>{
    if(!user){
      me=null;if(unsub){unsub();unsub=null;}
      $("game").classList.add("hidden");$("lobby").classList.add("hidden");$("auth").classList.remove("hidden");
      return;
    }
    me=user.uid; uname=(user.email||"player@x").split("@")[0];
    isAdm=(user.email===ADMIN_EMAIL);
    if(!isAdm){
      let ok=false;
      try{const m=await db.collection("members").doc(user.uid).get();ok=m.exists;}catch(e){}
      if(!ok){await firebase.auth().signOut();say("amsg","Your account is not active. Ask the admin to add you.");return;}
    }
    $("adminBox").classList.toggle("hidden",!isAdm);
    if(isAdm)loadPlayers();
    $("auth").classList.add("hidden"); $("who").textContent=uname; $("name").value=uname;
    const saved=store("lg_code");
    if(saved){ try{await enter(saved);return;}catch(e){} }
    $("lobby").classList.remove("hidden");
  });
}
function mail(u){return u.toLowerCase()+"@luma-love.app";}
function cred(){
  const u=$("un").value.trim().toLowerCase(), p=$("pw").value;
  if(!/^[a-z0-9_]{3,20}$/.test(u)){say("amsg","Username: 3-20 letters, numbers or _ (no spaces).");return null;}
  if(p.length<6){say("amsg","Password must be at least 6 characters.");return null;}
  return {u,p};
}
function aerr(e){
  const c=e.code||"";
  if(c.includes("email-already"))return "That username is taken. Choose another.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return "Wrong username or password.";
  if(c.includes("weak-password"))return "Password is too weak.";
  if(c.includes("operation-not-allowed"))return "Turn on Email/Password sign-in in Firebase.";
  if(c.includes("network"))return "No internet connection.";
  return "Could not continue. Try again.";
}
$("login").onclick=async()=>{say("amsg","");const c=cred();if(!c)return;try{await firebase.auth().signInWithEmailAndPassword(mail(c.u),c.p);}catch(e){say("amsg",aerr(e));}};

async function loadPlayers(){
  const box=$("plist");box.textContent="";
  try{
    const q=await db.collection("members").get();
    if(q.empty){box.textContent="No players yet.";return;}
    q.forEach(d=>{
      const r=document.createElement("div");r.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)";
      const n=document.createElement("span");n.textContent=d.data().username||d.id;
      const b=document.createElement("button");b.textContent="Remove";b.className="alt";b.style.cssText="width:auto;margin:0;padding:6px 12px;font-size:13px";
      b.onclick=async()=>{if(!confirm("Remove "+n.textContent+"?"))return;try{await db.collection("members").doc(d.id).delete();loadPlayers();}catch(e){say("admsg","Could not remove.");}};
      r.append(n,b);box.append(r);
    });
  }catch(e){box.textContent="Could not load players.";}
}
$("addP").onclick=async()=>{
  say("admsg","");
  const u=$("nun").value.trim().toLowerCase(),p=$("npw").value;
  if(!/^[a-z0-9_]{3,20}$/.test(u)){say("admsg","Username: 3-20 letters, numbers or _.");return;}
  if(p.length<6){say("admsg","Password must be at least 6 characters.");return;}
  try{
    let app2;try{app2=firebase.app("creator");}catch(e){app2=firebase.initializeApp(firebaseConfig,"creator");}
    const cr=await app2.auth().createUserWithEmailAndPassword(mail(u),p);
    const uid=cr.user.uid;
    await app2.auth().signOut();
    await db.collection("members").doc(uid).set({username:u,created:Date.now()});
    $("nun").value="";$("npw").value="";
    say("admsg","Player “"+u+"” added. Tell them the username and password.");
    loadPlayers();
  }catch(e){say("admsg",aerr(e));}
};
$("logout").onclick=()=>{store("lg_code",null);firebase.auth().signOut();};

function nm(){return uname;}

$("create").onclick=async()=>{
  say("lmsg","");
  try{
    
    const c=newCode();
    await db.collection("games").doc(c).set({
      seed:Math.floor(Math.random()*1e9), order:[me], names:{[me]:nm()}, scores:{[me]:0},
      used:[], turn:0, phase:"pick", cur:null, last:null, ver:1
    });
    await enter(c);
  }catch(e){say("lmsg","Could not create the game. Check your internet and Firebase rules.");}
};

$("joinBtn").onclick=async()=>{
  say("lmsg","");
  const c=$("join").value.trim().toUpperCase();
  if(c.length!==5){say("lmsg","Enter the 5-character code.");return;}
  try{
    
    const s=await db.collection("games").doc(c).get();
    if(!s.exists){say("lmsg","Game not found. Check the code.");return;}
    const d=s.data();
    if(!d.order.includes(me)){
      if(d.order.length>=2){say("lmsg","That game already has two players.");return;}
      await db.collection("games").doc(c).update({order:firebase.firestore.FieldValue.arrayUnion(me),["names."+me]:nm(),["scores."+me]:0});
    }
    await enter(c);
  }catch(e){say("lmsg","Could not join. Check the code and your internet.");}
};

async function enter(c){
  code=c; ref=db.collection("games").doc(c);
  const s=await ref.get();
  if(!s.exists){store("lg_code",null);throw new Error("none");}
  store("lg_code",c);
  $("lobby").classList.add("hidden"); $("game").classList.remove("hidden");
  $("codeShow").textContent=c; $("codeSmall").textContent=c;
  let to=setTimeout(()=>say("gmsg","Connection is slow. Check your internet."),10000);
  unsub=ref.onSnapshot(snap=>{clearTimeout(to);say("gmsg","");if(snap.exists){st=snap.data();render();}},()=>{clearTimeout(to);say("gmsg","Connection lost. Reload the page.");});
}

function other(){return st.order.find(x=>x!==me);}
function pname(id){return (st.names&&st.names[id])||"Partner";}

function render(){
  if(seedUsed!==st.seed){tasks=shuffled(st.seed);seedUsed=st.seed;}
  const two=st.order.length===2;
  $("waiting").classList.toggle("hidden",two);
  $("pick").classList.add("hidden"); $("taskCard").classList.add("hidden");
  $("used").textContent=st.used.length;
  $("scores").innerHTML="";
  st.order.forEach((id,i)=>{
    const d=document.createElement("div");
    d.className="sc"+(two&&i===st.turn?" on":"");
    const a=document.createElement("div");a.className="n";a.textContent=pname(id)+(id===me?" (you)":"");
    const b=document.createElement("div");b.className="p";b.textContent=(st.scores&&st.scores[id])||0;
    d.append(a,b);$("scores").append(d);
  });
  $("res").textContent=st.last?st.last:"";
  if(!two) return;
  const turnId=st.order[st.turn], mine=turnId===me;
  if(st.phase==="pick"){
    $("pick").classList.remove("hidden");
    $("pickBox").classList.toggle("hidden",!mine);
    $("pickInfo").textContent=mine?"It’s your turn!":"Waiting for "+pname(turnId)+" to pick a number…";
  }else{
    const k=tasks[st.cur-1];
    $("taskCard").classList.remove("hidden");
    $("tn").textContent="Number "+st.cur;
    $("tc").textContent=k.c; $("tt").textContent=k.t;
    $("did").classList.add("hidden"); $("confirmBox").classList.add("hidden");
    if(st.phase==="doing"){
      $("tinfo").textContent=mine?"Do this task for your partner, then tap the button.":pname(turnId)+" is doing this task for you…";
      if(mine)$("did").classList.remove("hidden");
    }else{
      if(mine){$("tinfo").textContent="Waiting for "+pname(other())+" to confirm…";}
      else{$("tinfo").textContent="";$("askQ").textContent="Satisfied with how "+pname(turnId)+" did it?";$("confirmBox").classList.remove("hidden");}
    }
  }
}

async function pickNum(n){
  if(!st||st.order.length<2||st.order[st.turn]!==me||st.phase!=="pick")return;
  if(!n||n<1||n>TOTAL){say("msg","Pick a number from 1 to "+TOTAL+".");return;}
  if(st.used.includes(n)){say("msg","That number was already played. Choose another one.");return;}
  say("msg","");
  try{await ref.update({phase:"doing",cur:n,used:[...st.used,n],last:null});$("num").value="";}catch(e){say("msg","Could not save. Try again.");}
}
$("go").onclick=()=>pickNum(parseInt($("num").value,10));
$("num").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click();});
$("rnd").onclick=()=>{
  if(st.used.length>=TOTAL){say("msg","All tasks have been played!");return;}
  let n;do{n=1+Math.floor(Math.random()*TOTAL);}while(st.used.includes(n));
  pickNum(n);
};
$("did").onclick=async()=>{try{await ref.update({phase:"confirm"});}catch(e){say("gmsg","Could not save. Try again.");}};
async function verdict(ok){
  const doer=st.order[st.turn];
  const sc={...st.scores};
  if(ok)sc[doer]=(sc[doer]||0)+10;
  const msg=ok?pname(doer)+" earned 10 points! 🎉":pname(doer)+" got 0 this time. 💔";
  try{await ref.update({scores:sc,phase:"pick",cur:null,turn:1-st.turn,last:msg});}catch(e){say("gmsg","Could not save. Try again.");}
}
$("yes").onclick=()=>verdict(true);
$("nope").onclick=()=>verdict(false);
$("again").onclick=async()=>{
  if(!confirm("Start a fresh game? Scores and played numbers will reset."))return;
  const sc={};st.order.forEach(id=>sc[id]=0);
  try{await ref.update({seed:Math.floor(Math.random()*1e9),used:[],turn:0,phase:"pick",cur:null,last:null,scores:sc});}catch(e){say("gmsg","Could not reset. Try again.");}
};
$("leave").onclick=()=>{if(unsub)unsub();store("lg_code",null);st=null;$("game").classList.add("hidden");$("lobby").classList.remove("hidden");};

$("playNow").onclick=$("hot").onclick=()=>{$("splash").style.display="none";};
init();
</script>
</body>
</html>
